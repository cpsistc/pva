<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Hex Layer Map</title>
<style>
/* ── Reset & base ─────────────────────────────────────── */
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'JetBrains Mono','Fira Code',monospace; overflow:hidden; }
#map  { width:100vw; height:100vh; position:relative; }
#basemap     { position:absolute; inset:0; z-index:0; transition:opacity .3s; }
#deck-canvas { position:absolute; inset:0; z-index:1; }

/* ── Sidebar columns ──────────────────────────────────── */
#sidebar-container {
  position:absolute; top:20px; left:20px; z-index:10;
  display:flex; gap:10px; align-items:flex-start;
  pointer-events:none;
}
.sidebar-column {
  display:flex; flex-direction:column; gap:10px;
  width:276px;
  max-height:calc(100vh - 40px);
  overflow-y:auto; scrollbar-width:none;
  pointer-events:none;
}
.panel { pointer-events:auto; }
.sidebar-column::-webkit-scrollbar { display:none; }

/* ── Panel ────────────────────────────────────────────── */
.panel {
  background:rgba(10,10,22,0.84);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:14px 16px;
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  color:rgba(255,255,255,0.8); font-size:11px; line-height:1.75;
}
.panel-title {
  font-size:10px; color:rgba(255,255,255,0.38);
  letter-spacing:0.18em; text-transform:uppercase;
  margin-bottom:10px; padding-bottom:8px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  display:flex; align-items:center; gap:6px;
}
.section-title {
  font-size:9.5px; color:rgba(255,255,255,0.6);
  letter-spacing:0.12em; text-transform:uppercase;
  margin:14px 0 7px;
}

/* ── Legend with checkboxes ───────────────────────────── */
.layer-legend {
  display:flex; align-items:center; gap:8px; margin:4px 0;
  cursor:pointer; user-select:none;
  transition:background .15s;
  padding:3px 5px; border-radius:6px;
}
.layer-legend:hover { background:rgba(255,255,255,0.04); }
.layer-legend input[type=checkbox] {
  appearance:none; -webkit-appearance:none;
  width:14px; height:14px; flex-shrink:0;
  border:1px solid rgba(255,255,255,0.2);
  border-radius:3px; position:relative;
  cursor:pointer; transition:background .2s, border-color .2s;
}
.layer-legend input[type=checkbox]:checked { border-color:#4aaeff; }
.layer-legend input[type=checkbox]:checked::after {
  content:''; position:absolute; inset:2px;
  border-radius:2px;
}
.legend-label { flex:1; font-size:10px; color:rgba(255,255,255,0.82); }
.legend-sub   { font-size:9px;  color:rgba(255,255,255,0.3); }

/* ── Checkbox ─────────────────────────────────────────── */
.cfg-row { display:flex; align-items:center; gap:8px; margin:4px 0; cursor:pointer; }
.cfg-row input[type=checkbox] {
  appearance:none; -webkit-appearance:none;
  width:14px; height:14px; flex-shrink:0;
  border:1px solid rgba(255,255,255,0.2);
  border-radius:3px; background:rgba(255,255,255,0.04);
  cursor:pointer; position:relative;
  transition:background .2s, border-color .2s;
}
.cfg-row input[type=checkbox]:checked { background:#4aaeff; border-color:#4aaeff; }
.cfg-row input[type=checkbox]:checked::after {
  content:''; position:absolute; left:3px; top:0;
  width:4px; height:8px;
  border:2px solid #fff; border-top:none; border-left:none;
  transform:rotate(45deg);
}
.cfg-row span { font-size:10px; color:rgba(255,255,255,0.68); user-select:none; }

/* ── Layer cards ──────────────────────────────────────── */
#layer-editor { display:flex; flex-direction:column; gap:7px; }
.layer-card {
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:8px; overflow:hidden; transition:border-color .2s;
}
.layer-card:hover { border-color:rgba(255,255,255,0.13); }
.layer-card-header {
  display:flex; align-items:center; gap:7px;
  padding:8px 10px; cursor:pointer; user-select:none;
}
.card-swatch { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.card-label  { flex:1; font-size:10px; font-weight:600; color:rgba(255,255,255,0.85); }
.card-sub    { font-size:9px; color:rgba(255,255,255,0.26); }
.toggle-arrow { font-size:9px; color:rgba(255,255,255,0.26); transition:transform .2s; }
.btn-del {
  background:none; border:none; color:rgba(255,80,80,0.4);
  cursor:pointer; font-size:13px; padding:0 2px; line-height:1;
  transition:color .15s;
}
.btn-del:hover { color:rgba(255,80,80,0.9); }
.layer-card-body { padding:0 10px 10px; display:none; flex-direction:column; gap:6px; }
.layer-card-body.open { display:flex; }

/* ── Form fields ──────────────────────────────────────── */
.field-row { display:flex; align-items:center; gap:6px; }
.field-row label {
  font-size:9px; color:rgba(255,255,255,0.32);
  letter-spacing:0.07em; text-transform:uppercase;
  width:56px; flex-shrink:0;
}
.field-row input[type=text],
.field-row input[type=number] {
  flex:1; background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:5px; padding:4px 7px 4px 7px;
  color:#fff; font-size:10px; font-family:inherit;
  outline:none; transition:border-color .15s;
}
.field-row input:focus { border-color:rgba(74,174,255,0.5); }
.field-row input[type=color] {
  width:30px; height:22px; padding:1px;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:5px; background:none; cursor:pointer;
}

/* ── Styled number input (side-by-side spinners) ────── */
.field-row input[type=number] {
  -moz-appearance:textfield; /* Hide default Firefox spinners */
}
.field-row input[type=number]::-webkit-outer-spin-button,
.field-row input[type=number]::-webkit-inner-spin-button {
  -webkit-appearance:none; margin:0;
}
.number-input-wrapper {
  position:relative; flex:1; display:flex;
}
.number-input-wrapper input { width:100%; padding-right:42px; }
.spinner-btns {
  position:absolute; right:3px; top:50%; transform:translateY(-50%);
  display:flex; gap:2px; height:calc(100% - 6px);
}
.spinner-btn {
  width:18px; height:100%;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:3px;
  color:rgba(255,255,255,0.5);
  font-size:10px; line-height:1; font-weight:600;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s;
  user-select:none;
}
.spinner-btn:hover { background:rgba(255,255,255,0.12); color:rgba(255,255,255,0.85); }
.spinner-btn:active { background:rgba(74,174,255,0.15); }

/* ── Buttons ──────────────────────────────────────────── */
.apply-btn {
  margin-top:4px; width:100%;
  background:rgba(74,174,255,0.1); border:1px solid rgba(74,174,255,0.22);
  border-radius:5px; padding:5px 0;
  color:#4aaeff; font-size:10px; font-family:inherit;
  cursor:pointer; letter-spacing:0.06em; transition:background .15s;
}
.apply-btn:hover { background:rgba(74,174,255,0.2); }

#btn-add-layer {
  width:100%; padding:7px 0; margin-top:8px;
  background:rgba(255,255,255,0.03);
  border:1px dashed rgba(255,255,255,0.12); border-radius:8px;
  color:rgba(255,255,255,0.38); font-size:10px; font-family:inherit;
  cursor:pointer; letter-spacing:0.06em;
  transition:background .15s, border-color .15s, color .15s;
}
#btn-add-layer:hover { background:rgba(255,255,255,0.07); border-color:rgba(255,255,255,0.24); color:rgba(255,255,255,0.72); }

.btn-restore {
  width:100%; padding:6px 0;
  background:rgba(255,200,80,0.07); border:1px solid rgba(255,200,80,0.16);
  border-radius:6px; color:rgba(255,200,80,0.8);
  font-size:10px; font-family:inherit; cursor:pointer; letter-spacing:0.06em;
  transition:background .15s, border-color .15s;
}
.btn-restore:hover { background:rgba(255,200,80,0.14); border-color:rgba(255,200,80,0.28); }

/* ── Color/background row ─────────────────────────────── */
.color-control-row {
  display:flex; align-items:center; gap:6px; margin-top:4px;
}
.color-control-row label {
  font-size:9px; color:rgba(255,255,255,0.32);
  letter-spacing:0.07em; text-transform:uppercase;
  width:56px; flex-shrink:0;
}
.color-control-row input[type=color] {
  width:30px; height:22px; padding:1px;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:5px; background:none; cursor:pointer;
}
.color-preset-btn {
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
  border-radius:4px; padding:3px 7px;
  color:rgba(255,255,255,0.6); font-size:9px; font-family:inherit;
  cursor:pointer; transition:background .15s, color .15s;
}
.color-preset-btn:hover { background:rgba(255,255,255,0.12); color:#fff; }

.btn-reset-view {
  width:100%; padding:6px 0; margin-top:6px;
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.11);
  border-radius:6px; color:rgba(255,255,255,0.55);
  font-size:10px; font-family:inherit; cursor:pointer; letter-spacing:0.06em;
  transition:background .15s, color .15s;
}
.btn-reset-view:hover { background:rgba(255,255,255,0.09); color:rgba(255,255,255,0.85); }

/* ── Save/Load ────────────────────────────────────────── */
#save-panel { display:flex; flex-direction:column; gap:7px; }
.saved-config-row { display:flex; align-items:center; gap:5px; }
.saved-config-name { flex:1; font-size:10px; color:rgba(255,255,255,0.75); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.saved-config-date { font-size:9px; color:rgba(255,255,255,0.26); white-space:nowrap; }
.btn-icon { background:none; border:none; cursor:pointer; font-size:12px; padding:2px 3px; border-radius:4px; transition:background .15s; }
.btn-load  { color:rgba(74,174,255,0.8); }
.btn-load:hover  { background:rgba(74,174,255,0.12); color:#4aaeff; }
.btn-erase { color:rgba(255,100,100,0.55); }
.btn-erase:hover { background:rgba(255,80,80,0.12); color:rgba(255,100,100,0.9); }
.save-input-row { display:flex; gap:6px; align-items:center; margin-top:4px; }
.save-input-row input[type=text] {
  flex:1; background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:5px; padding:4px 7px;
  color:#fff; font-size:10px; font-family:inherit;
  outline:none; transition:border-color .15s;
}
.save-input-row input:focus { border-color:rgba(74,174,255,0.5); }
.btn-save-new {
  background:rgba(74,174,255,0.1); border:1px solid rgba(74,174,255,0.22);
  border-radius:5px; padding:4px 10px;
  color:#4aaeff; font-size:10px; font-family:inherit;
  cursor:pointer; white-space:nowrap; transition:background .15s;
}
.btn-save-new:hover { background:rgba(74,174,255,0.2); }
.empty-hint { font-size:9px; color:rgba(255,255,255,0.22); font-style:italic; }

/* ── Tooltip (right column) ───────────────────────────── */
#tooltip { display:none; }
.tip-label { font-size:9px; color:rgba(255,255,255,0.4); letter-spacing:0.1em; text-transform:uppercase; }
.tip-val   { color:#fff; font-weight:600; margin-bottom:3px; font-size:11px; }
</style>

<body>

<div id="map">
  <div id="basemap"></div>
  <canvas id="deck-canvas"></canvas>
</div>

<div id="sidebar-container">

  <!-- Left column -->
  <div class="sidebar-column">

    <!-- ① Legend -->
    <div class="panel" id="ui">
      <div class="panel-title"><span>⬡</span> Hex Layers</div>
      <div style="display:flex;gap:5px;margin-bottom:8px"><button class="apply-btn" style="margin-top:0" id="btn-show-all">Show all</button><button class="apply-btn" style="margin-top:0" id="btn-hide-all">Hide all</button></div>
      <div id="legend"></div>
      <div style="margin-top:8px;font-size:9px;color:rgba(255,255,255,0.2);line-height:1.6">
        Click checkbox to show/hide · hover hexagon · click to copy H3 id
      </div>
    </div>

    <!-- ② Config -->
    <div class="panel" id="config">
      <div class="panel-title"><span>⚙</span> Config</div>

      <!-- Display toggles -->
      <div class="section-title">Display</div>
      <label class="cfg-row">
        <input type="checkbox" id="chk-flow">
        <span>Flow arrows &amp; probabilities</span>
      </label>
      <label class="cfg-row">
        <input type="checkbox" id="chk-map">
        <span>Show basemap</span>
      </label>

      <!-- Background / water color -->
      <div class="section-title" style="margin-top:11px" id="bg-section-label">Water color</div>
      <div class="color-control-row">
        <label id="bg-color-label">Color</label>
        <input type="color" id="bg-color-picker" value="#ffffff">
        <button class="color-preset-btn" id="btn-bg-white">White</button>
        <button class="color-preset-btn" id="btn-bg-default">Default</button>
      </div>

      <!-- View -->
      <div class="section-title" style="margin-top:11px">Center</div>
      <div class="color-control-row">
        <label>Color</label>
        <input type="color" id="center-color-picker" value="#ffffff">
        <button class="color-preset-btn" id="btn-center-black">Black</button>
        <button class="color-preset-btn" id="btn-center-default">Default</button>
      </div>
      <div class="field-row" style="margin-top:8px">
        <label>Latitude</label>
        <div class="number-input-wrapper">
          <input type="number" id="inp-lat" value="48.13" step="0.1" min="-90" max="90">
          <div class="spinner-btns">
            <div class="spinner-btn" data-delta="-0.1">−</div>
            <div class="spinner-btn" data-delta="0.1">+</div>
          </div>
        </div>
      </div>
      <div class="field-row">
        <label>Longitude</label>
        <div class="number-input-wrapper">
          <input type="number" id="inp-lng" value="-6.7" step="0.1" min="-180" max="180">
          <div class="spinner-btns">
            <div class="spinner-btn" data-delta="-0.1">−</div>
            <div class="spinner-btn" data-delta="0.1">+</div>
          </div>
        </div>
      </div>
      <button class="apply-btn" id="btn-apply-center" style="margin-top:6px">Apply center</button>
      <button class="btn-reset-view" id="btn-reset-view">⌖ Reset view</button>

      <!-- Layers -->
      <div class="section-title" style="margin-top:14px">Layers</div>
      <div id="layer-editor"></div>
      <button id="btn-add-layer">＋ Add layer</button>
    </div>

    <!-- ③ Save / Load -->
    <div class="panel" id="saveload-panel">
      <div class="panel-title"><span>💾</span> Saves</div>
      <div id="save-panel"></div>
      <div class="save-input-row" style="margin-top:8px">
        <input type="text" id="cfg-name-input" placeholder="Config name…" maxlength="40">
        <button class="btn-save-new" id="btn-save-cfg">Save</button>
      </div>
      <button class="btn-restore" id="btn-restore" style="margin-top:8px">↺ Restore default layers</button>
    </div>

  </div>

  <!-- Right column (tooltip) -->
  <div style="pointer-events:none">
    <div class="panel" id="tooltip" style="pointer-events:auto;width:max-content;min-width:140px"></div>
  </div>

</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════
const GLOBAL_ALPHA     = 195;
const COVERAGE         = 0.97;
const HIGHLIGHT_HEXA   = [180, 220, 255, 160];
const ARROW_DECIMALS   = 1;
const ARROW_COLOR      = [255, 255, 255];
const ARROW_ALPHA      = 255;
const ARROW_REACH      = 0.60;
const ARROW_MAX_FACTOR = 0.30;
const ARROW_MIN_FACTOR = 0.03;
const LABEL_COLOR      = [255, 255, 255, 255];
const STORAGE_KEY      = 'hex3d_saved_configs';

const COLOR_WHITE      = '#ffffff';
const COLOR_BLACK      = '#000000';
const COLOR_DEFAULT_BG = '#1a3a4a';

const DEFAULT_INIT_VIEW = { longitude:-6.7, latitude:48.13, zoom:10, pitch:60, bearing:-20 };

const DEFAULT_LAYERS = [
  { id:'surface', label:'Surface',       altitude:0,     resolution:8, radiusKm:10, baseColor:'#4aaeff', palette:[[0,60,160],[40,130,220],[180,220,255]], visible:true },
  { id:'mid',     label:'Mid Altitude',  altitude:5000,  resolution:7, radiusKm:12, baseColor:'#14aabc', palette:[[0,100,120],[20,170,190],[160,235,245]], visible:true },
  { id:'upper',   label:'Upper Altitude',altitude:15000, resolution:7, radiusKm:18, baseColor:'#28c89b', palette:[[0,130,100],[40,200,160],[180,245,225]], visible:true },
];

// ── Mutable state ─────────────────────────────────────────
let CENTER_LAT  = DEFAULT_INIT_VIEW.latitude;
let CENTER_LNG  = DEFAULT_INIT_VIEW.longitude;
let FLAT_LAYERS = deepClone(DEFAULT_LAYERS);
let ALL_DATA    = [];
let hovered     = [];
let SHOW_FLOW    = false;
let SHOW_MAP     = false;
let BG_COLOR     = COLOR_WHITE;
let CENTER_COLOR = null; // null = use gradient (default behaviour)
let _idCounter   = 100;

// ═══════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function newLayerId(){ return 'L' + (_idCounter++); }

function hexToRgb(h){ return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgbToHex(r,g,b){ return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''); }
function generatePalette(hex){
  const[r,g,b]=hexToRgb(hex);
  return[
    [Math.round(r*.28),Math.round(g*.28),Math.round(b*.28)],
    [r,g,b],
    [Math.round(r+(255-r)*.55),Math.round(g+(255-g)*.55),Math.round(b+(255-b)*.55)],
  ];
}

function haversineKm(la1,lo1,la2,lo2){
  const R=6371,r=Math.PI/180;
  const a=Math.sin((la2-la1)*r/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function lerpColor(p,t){
  const n=p.length-1,i=Math.min(Math.floor(t*n),n-1),f=t*n-i;
  return p[i].map((c,k)=>Math.round(c+f*(p[i+1][k]-c)));
}
function stableValue(s){
  let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return(h%1000)/1000;
}
function cellToXYZ(cell,alt){ return h3.cellToBoundary(cell).map(([la,ln])=>[ln,la,alt]); }
function getCellsInRadius(lat,lng,rKm,res){
  const ctr=h3.latLngToCell(lat,lng,res);
  const k=Math.ceil(rKm/(h3.getHexagonEdgeLengthAvg(res,'km')*1.5))+1;
  return h3.gridDisk(ctr,k).filter(c=>{ const[la,ln]=h3.cellToLatLng(c); return haversineKm(lat,lng,la,ln)<=rKm; });
}
function shrinkPoly(poly,cx,cy,f){ return poly.map(([x,y,z])=>[cx+(x-cx)*f,cy+(y-cy)*f,z]); }

function getNeighbourFlow(cell){
  const nb=h3.gridDisk(cell,1).filter(c=>c!==cell);
  const raw=nb.map(n=>Math.max(0.01,stableValue(cell+':'+n)));
  const sum=raw.reduce((a,b)=>a+b,0);
  return nb.map((c,i)=>{ const[la,ln]=h3.cellToLatLng(c); return{cell:c,pct:(raw[i]/sum)*100,lat:la,lng:ln}; });
}

function makeArrowPoly(fLng,fLat,tLng,tLat,wM,alt){
  const cl=Math.cos(fLat*Math.PI/180);
  const dx=(tLng-fLng)*cl,dy=tLat-fLat,len=Math.sqrt(dx*dx+dy*dy);
  const ux=dx/len,uy=dy/len,px=-uy,py=ux;
  const hw=(wM/2)/111000,hwT=hw*2.2;
  const sf=0.18,ef=ARROW_REACH,tf=ef+0.1;
  const sx=fLng+(ux*len*sf)/cl,sy=fLat+uy*len*sf;
  const ex=fLng+(ux*len*ef)/cl,ey=fLat+uy*len*ef;
  const tx=fLng+(ux*len*tf)/cl,ty=fLat+uy*len*tf;
  return[[sx+(px/cl)*hw,sy+py*hw,alt],[ex+(px/cl)*hwT,ey+py*hwT,alt],[tx,ty,alt],[ex-(px/cl)*hwT,ey-py*hwT,alt],[sx-(px/cl)*hw,sy-py*hw,alt]];
}

function buildData(cfg){
  const centerCell = h3.latLngToCell(CENTER_LAT, CENTER_LNG, cfg.resolution);
  return getCellsInRadius(CENTER_LAT,CENTER_LNG,cfg.radiusKm,cfg.resolution).map(cell=>{
    const[cLat,cLng]=h3.cellToLatLng(cell);
    const tDist=Math.min(haversineKm(CENTER_LAT,CENTER_LNG,cLat,cLng)/cfg.radiusKm,1);
    const isCenter = (cell === centerCell);
    return{
      cell,
      poly3d:shrinkPoly(cellToXYZ(cell,cfg.altitude),cLng,cLat,COVERAGE),
      poly2d:h3.cellToBoundary(cell).map(([la,ln])=>[ln,la]),
      rgb:lerpColor(cfg.palette,tDist), alpha:GLOBAL_ALPHA, tDist, cLat, cLng, isCenter,
    };
  });
}

// ═══════════════════════════════════════════════════════════
//  DECK.GL
// ═══════════════════════════════════════════════════════════
const { Deck, PolygonLayer, TextLayer, MapView } = deck;

function makeFlatLayer(cfg,data,idx){
  if(!cfg.visible) return null;
  return new PolygonLayer({
    id:`flat-${cfg.id}`,data,pickable:true,filled:true,stroked:false,extruded:false,positionFormat:'XYZ',
    getPolygon:d=>hovered[idx]===d.cell?d.poly2d.map(([ln,la])=>[ln,la,cfg.altitude]):d.poly3d,
    getFillColor:d=>{
      if(hovered[idx]===d.cell) return HIGHLIGHT_HEXA;
      if(d.isCenter && CENTER_COLOR !== null) return [...hexToRgb(CENTER_COLOR), d.alpha];
      return [...d.rgb,d.alpha];
    },
    onHover:info=>{ const p=hovered[idx]; hovered[idx]=info.object?.cell??null; if(p!==hovered[idx])render(); showTip(info,cfg); },
    onClick:info=>{ if(!info.object)return; navigator.clipboard.writeText(info.object.cell); const el=document.getElementById('tooltip'); const cid=el.querySelector('.cell-id'); if(cid){cid.textContent='✓ Copied!'; setTimeout(()=>{cid.textContent=info.object.cell;},1200);} },
    updateTriggers:{getFillColor:[hovered[idx],CENTER_COLOR],getPolygon:hovered[idx]},
  });
}
function makePrismLayer(cfg,data,lo,hi,idx,valid){
  // Always return a layer — empty data clears any previously rendered prism geometry.
  const cell = (valid && cfg.visible) ? hovered[idx] : null;
  const items = cell ? data.filter(d=>d.cell===cell) : [];
  // For sub-surface layers (lo < 0), the base polygon sits at lo and extrudes upward by (hi-lo).
  // For above-surface layers, same: base at lo, top at hi.
  const elevation = (valid && hi > lo) ? hi - lo : 0;
  return new PolygonLayer({
    id:`prism-${cfg.id}`,data:items,pickable:false,filled:true,stroked:false,extruded:true,wireframe:false,positionFormat:'XYZ',
    getPolygon:d=>d.poly2d.map(([ln,la])=>[ln,la,lo]),
    getElevation:elevation, getFillColor:d=>[...d.rgb,125], updateTriggers:{data:cell,lo,hi},
  });
}
function makeArrowLayer(cfg,data,idx){
  if(!SHOW_FLOW || !cfg.visible)return null;
  const cell=hovered[idx]; if(!cell)return null;
  const hov=data.find(d=>d.cell===cell); if(!hov)return null;
  const flow=getNeighbourFlow(cell);
  const alt=cfg.altitude+10;
  const eM=h3.getHexagonEdgeLengthAvg(cfg.resolution,'m');
  const maxW=eM*ARROW_MAX_FACTOR,minW=eM*ARROW_MIN_FACTOR;
  const ad=flow.map(f=>({polygon:makeArrowPoly(hov.cLng,hov.cLat,f.lng,f.lat,minW+(f.pct/100)*(maxW-minW),alt),pct:f.pct}));
  const cr=eM*0.4,dpm=1/111000,cl=Math.cos(hov.cLat*Math.PI/180);
  ad.push({polygon:Array.from({length:32},(_,i)=>{const a=(i/32)*2*Math.PI;return[hov.cLng+(Math.cos(a)*cr*dpm)/cl,hov.cLat+Math.sin(a)*cr*dpm,alt];}),pct:0});
  return new PolygonLayer({id:`arrows-${cfg.id}`,data:ad,pickable:false,filled:true,stroked:false,extruded:false,positionFormat:'XYZ',getPolygon:d=>d.polygon,getFillColor:[...ARROW_COLOR,ARROW_ALPHA],updateTriggers:{data:cell}});
}
function makeArrowLabelLayer(cfg,data,idx){
  if(!SHOW_FLOW || !cfg.visible)return null;
  const cell=hovered[idx]; if(!cell)return null;
  const hov=data.find(d=>d.cell===cell); if(!hov)return null;
  const flow=getNeighbourFlow(cell);
  // Size in meters = 30% of hex edge length, always proportional regardless of zoom
  const edgeM = h3.getHexagonEdgeLengthAvg(cfg.resolution, 'm');
  const textSize = edgeM * 0.30;
  return new TextLayer({
    id:`lbl-${cfg.id}`,
    data:flow.map(f=>({position:[f.lng,f.lat,cfg.altitude+200],text:f.pct.toFixed(ARROW_DECIMALS)+'%'})),
    pickable:false,getPosition:d=>d.position,getText:d=>d.text,
    sizeUnits:'meters',getSize:textSize,
    getColor:LABEL_COLOR,fontFamily:'JetBrains Mono,monospace',fontWeight:'bold',
    billboard:true,getTextAnchor:'middle',getAlignmentBaseline:'center',
    fontSettings:{sdf:true},outlineWidth:3,outlineColor:[0,0,0,200],updateTriggers:{data:cell},
  });
}

function render(){
  const layers=[];
  const GAP = 5; // metres offset to avoid z-fighting at layer boundaries

  // Sort a copy by altitude so neighbour lookups are correct regardless of add order
  const byAlt = [...FLAT_LAYERS].sort((a,b) => a.altitude - b.altitude);

  FLAT_LAYERS.forEach((cfg,i)=>{
    // ── Prism: always push a layer (possibly empty) so deck.gl clears stale geometry ──
    let prismLo = 0, prismHi = 0, prismValid = false;
    if(cfg.altitude !== 0){
      if(cfg.altitude > 0){
        // Above surface: prism fills gap DOWN to the nearest layer with lower altitude
        const below = byAlt.filter(l => l.altitude < cfg.altitude);
        if(below.length){
          const neighbour = below[below.length-1];
          const lo = neighbour.altitude + GAP;
          const hi = cfg.altitude - GAP;
          if(hi > lo){ prismLo=lo; prismHi=hi; prismValid=true; }
        }
      } else {
        // Below surface: prism fills gap UP to the nearest layer with higher altitude
        const above = byAlt.filter(l => l.altitude > cfg.altitude);
        if(above.length){
          const neighbour = above[0];
          const lo = cfg.altitude + GAP;  // e.g. -4995
          const hi = neighbour.altitude - GAP; // e.g. -5 (or 0-5=-5 if neighbour is surface)
          if(hi > lo){ prismLo=lo; prismHi=hi; prismValid=true; }
        }
      }
    }
    // Always push: if not valid/hovered, makePrismLayer returns empty-data layer that clears old geometry
    layers.push(makePrismLayer(cfg, ALL_DATA[i], prismLo, prismHi, i, prismValid));

    const flat=makeFlatLayer(cfg,ALL_DATA[i],i); if(flat)layers.push(flat);
    const a=makeArrowLayer(cfg,ALL_DATA[i],i); if(a)layers.push(a);
    const l=makeArrowLabelLayer(cfg,ALL_DATA[i],i); if(l)layers.push(l);
  });
  deckgl.setProps({layers});
}

function showTip(info,cfg){

    <div class="tip-label">Altitude</div><div class="tip-val">${(cfg.altitude/1000).toFixed(1)} km</div>

}

function buildLegend(){
  const el=document.getElementById('legend'); el.innerHTML='';
  const sorted=[...FLAT_LAYERS].sort((a,b)=>b.altitude-a.altitude);
  sorted.forEach(cfg=>{
    const mid=lerpColor(cfg.palette,.5);
    const label=document.createElement('label'); label.className='layer-legend';
    const chk=document.createElement('input'); chk.type='checkbox'; chk.checked=cfg.visible;
    chk.style.background=`rgb(${mid})`; // Show layer color in checkbox
    chk.addEventListener('change',()=>{ cfg.visible=chk.checked; render(); });
    const txtDiv=document.createElement('div'); txtDiv.style.flex='1';
    txtDiv.innerHTML=`<div class="legend-label">${cfg.label}</div>
      <div class="legend-sub">${(cfg.altitude/1e3).toFixed(0)} km · res ${cfg.resolution} · r ${cfg.radiusKm} km</div>`;
    label.appendChild(chk); label.appendChild(txtDiv);
    el.appendChild(label);
  });
}

}

  if(!isNaN(f.resolution)) c.resolution=Math.min(15,Math.max(0,f.resolution));
  if(!isNaN(f.radiusKm))   c.radiusKm  =f.radiusKm;
  if(f.baseColor){c.baseColor=f.baseColor;c.palette=generatePalette(f.baseColor);}

function getDefaultCenterColor(){
  // Returns the gradient color that the center hexagon would naturally have (tDist=0)
  // Uses the first visible layer's palette, or the first layer overall.
  const ref = FLAT_LAYERS.find(l => l.visible) || FLAT_LAYERS[0];
  if(!ref) return COLOR_BLACK;
  const rgb = lerpColor(ref.palette, 0);
  return rgbToHex(...rgb);
}

function applyCenterColor(colorHex){
  CENTER_COLOR = colorHex;
  document.getElementById('center-color-picker').value = colorHex || getDefaultCenterColor();
  render();
}

  CENTER_COLOR = null; // null = follow gradient

function applyCenter(lat, lng){
  CENTER_LAT = lat; CENTER_LNG = lng;
  document.getElementById('inp-lat').value = lat;
  document.getElementById('inp-lng').value = lng;
  currentViewState = {
    ...currentViewState,
    longitude: lng, latitude: lat,
    transitionDuration: 600,
    transitionInterpolator: new deck.FlyToInterpolator({ speed: 1.5 }),
  };
  deckgl.setProps({ viewState: currentViewState });
  map.flyTo({ center:[lng, lat], duration:600 });
  rebuildState();
}

// ═══════════════════════════════════════════════════════════
//  VIEW RESET
// ═══════════════════════════════════════════════════════════
function resetView(){
  const { FlyToInterpolator } = deck;
  const DURATION = 700;

  const visibleLayers = FLAT_LAYERS.filter(c => c.visible);
  const maxRadius = visibleLayers.length ? Math.max(...visibleLayers.map(c => c.radiusKm)) : 20;

  // Derive zoom so that maxRadius fills ~40% of the smaller viewport dimension.
  // At zoom 0, one tile is 256px and covers 360° longitude = ~40075 km at equator.
  // km per pixel at zoom z, latitude lat: (40075 * cos(lat)) / (256 * 2^z)
  // Solve for z: z = log2((40075 * cos(lat) * 0.40 * min(w,h)) / (256 * 2 * maxRadius))
  const cosLat = Math.cos(CENTER_LAT * Math.PI / 180);
  const viewSize = Math.min(window.innerWidth, window.innerHeight);
  const zoom = Math.log2((40075 * cosLat * 0.40 * viewSize) / (256 * 2 * maxRadius));

  currentViewState = {
    ...currentViewState,
    longitude: CENTER_LNG,
    latitude:  CENTER_LAT,
    zoom,
    pitch:   60,
    bearing: DEFAULT_INIT_VIEW.bearing,
    transitionDuration:     DURATION,
    transitionInterpolator: new FlyToInterpolator({ speed: 1.5 }),
  };
  deckgl.setProps({ viewState: currentViewState });
  map.flyTo({ center:[CENTER_LNG, CENTER_LAT], zoom, pitch:60, bearing:currentViewState.bearing, duration:DURATION });
}

function loadSavedConfigs(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}catch(e){return[];} }
function persistConfigs(list){ localStorage.setItem(STORAGE_KEY,JSON.stringify(list)); }

function saveConfig(name){
  if(!name||!name.trim())return;
  const list=loadSavedConfigs();
  const entry={
    id:Date.now(), name:name.trim(), date:new Date().toLocaleDateString('fr-FR'),
    layers:deepClone(FLAT_LAYERS),
    opts:{showFlow:SHOW_FLOW,showMap:SHOW_MAP,bgColor:BG_COLOR,centerLat:CENTER_LAT,centerLng:CENTER_LNG,centerColor:CENTER_COLOR},
  };
  const ex=list.findIndex(c=>c.name===entry.name);
  if(ex>=0)list[ex]=entry; else list.push(entry);
  persistConfigs(list); buildSavePanel();
}

function loadConfig(id){
  const entry=loadSavedConfigs().find(c=>c.id===id); if(!entry)return;
  FLAT_LAYERS=deepClone(entry.layers);
  // Ensure all layers have visible property
  FLAT_LAYERS.forEach(c=>{ if(c.visible===undefined) c.visible=true; });
  if(entry.opts){
    SHOW_FLOW = entry.opts.showFlow ?? SHOW_FLOW;
    SHOW_MAP  = entry.opts.showMap  ?? SHOW_MAP;
    BG_COLOR  = entry.opts.bgColor  ?? BG_COLOR;
    CENTER_COLOR = entry.opts.centerColor !== undefined ? entry.opts.centerColor : CENTER_COLOR;
    document.getElementById('chk-flow').checked = SHOW_FLOW;
    document.getElementById('chk-map').checked  = SHOW_MAP;
    applyMapVisibility();
    if(entry.opts.centerLat!=null){
      CENTER_LAT = entry.opts.centerLat;
      CENTER_LNG = entry.opts.centerLng;
      document.getElementById('inp-lat').value = CENTER_LAT;
      document.getElementById('inp-lng').value = CENTER_LNG;
    }
    rebuildState();
  } else { rebuildState(); }
  // Adapt view to the loaded config after a short delay to let rebuildState settle
  setTimeout(resetView, 50);
}

function deleteConfig(id){ persistConfigs(loadSavedConfigs().filter(c=>c.id!==id)); buildSavePanel(); }

function restoreDefaults(){ FLAT_LAYERS=deepClone(DEFAULT_LAYERS); rebuildState(); }

function buildSavePanel(){
  const cont=document.getElementById('save-panel'); cont.innerHTML='';
  const list=loadSavedConfigs();
  if(!list.length){ const h=document.createElement('div'); h.className='empty-hint'; h.textContent='No saved configurations yet.'; cont.appendChild(h); return; }
  list.forEach(entry=>{
    const row=document.createElement('div'); row.className='saved-config-row';
    row.innerHTML=`<div class="saved-config-name" title="${entry.name}">${entry.name}</div>
      <div class="saved-config-date">${entry.date}</div>
      <button class="btn-icon btn-load" title="Load">↓</button>
      <button class="btn-icon btn-erase" title="Delete">✕</button>`;
    row.querySelector('.btn-load').addEventListener('click',()=>loadConfig(entry.id));
    row.querySelector('.btn-erase').addEventListener('click',()=>deleteConfig(entry.id));
    cont.appendChild(row);
  });
}

const map=new maplibregl.Map({
  container:'basemap',
  style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center:[CENTER_LNG,CENTER_LAT],
  zoom:DEFAULT_INIT_VIEW.zoom, pitch:DEFAULT_INIT_VIEW.pitch, bearing:DEFAULT_INIT_VIEW.bearing,
  interactive:false,
});

// Controlled view state — we own this object; deck.gl reads it every frame.
let currentViewState = { ...DEFAULT_INIT_VIEW };

const deckgl=new Deck({
  canvas:'deck-canvas', width:'100%', height:'100%',
  viewState: currentViewState,
  controller:{ maxPitch:60 },
  views:new MapView({repeat:false}),
  layers:[],
  onViewStateChange:({viewState})=>{
    currentViewState = viewState;
    deckgl.setProps({ viewState: currentViewState });
    map.jumpTo({center:[viewState.longitude,viewState.latitude],zoom:viewState.zoom,pitch:viewState.pitch,bearing:viewState.bearing});
  },
});

map.on('load',()=>{
  // Force checkbox visual state to match JS state (prevents browser soft-reload mismatch)
  document.getElementById('chk-flow').checked = SHOW_FLOW;
  document.getElementById('chk-map').checked  = SHOW_MAP;
  applyMapVisibility(); applyBgColor(); updateBgLabel(); rebuildState();
  // Init center color picker to white (mirrors the "Default" state)
  document.getElementById('center-color-picker').value = COLOR_WHITE;
  buildSavePanel();
});
</script>
</body>
</html>

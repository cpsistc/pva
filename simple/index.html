<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Hex Layer Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ Left sidebar ════════════════════════════════════════ -->
<div id="sidebar">

  <!-- ① Hex Layers — visibility + editor combined -->
  <div class="panel" id="ui">
    <div class="panel-title"><span>⬡</span> Hex Layers</div>
    <div class="bulk-btns">
      <button class="apply-btn small" id="btn-show-all">Show all</button>
      <button class="apply-btn small" id="btn-hide-all">Hide all</button>
      <button class="apply-btn small accent" id="btn-add-layer">＋ Layer</button>
    </div>
    <div id="layer-editor"></div>
  </div>

  <!-- ② Settings -->
  <div class="panel" id="config">
    <div class="panel-title"><span>⚙</span> Settings</div>

    <div class="section-title">Display</div>
    <label class="cfg-row"><input type="checkbox" id="chk-flow"><span>Flow arrows &amp; probabilities</span></label>
    <label class="cfg-row"><input type="checkbox" id="chk-map"><span>Show basemap</span></label>
    <label class="cfg-row"><input type="checkbox" id="chk-axis"><span>Show axes</span></label>
    <div id="axis-options" style="display:none;flex-direction:column;gap:4px;margin:4px 0 2px 18px">
      <div class="field-row" style="align-items:center">
        <label style="width:52px">Length</label>
        <input type="range" id="axis-len" min="30" max="200" value="70" style="width:90px;flex:none">
        <span id="axis-len-val" style="font-size:9px;color:rgba(255,255,255,0.5);width:34px;text-align:right;flex-shrink:0">70px</span>
      </div>
      <div class="field-row" style="align-items:center">
        <label style="width:52px">Width</label>
        <input type="range" id="axis-width" min="1" max="8" value="2" step="0.5" style="width:90px;flex:none">
        <span id="axis-width-val" style="font-size:9px;color:rgba(255,255,255,0.5);width:34px;text-align:right;flex-shrink:0">2px</span>
      </div>
    </div>
    <label class="cfg-row"><input type="checkbox" id="chk-sci"><span>Show informative panels</span></label>
    <div id="sci-options" style="display:none;flex-direction:column;gap:4px;margin:4px 0 2px 18px">
      <div style="display:flex;gap:10px">
        <label class="cfg-row" style="margin:0"><input type="radio" name="sci-side" value="left" checked><span>Left</span></label>
        <label class="cfg-row" style="margin:0"><input type="radio" name="sci-side" value="right"><span>Right</span></label>
      </div>
      <div class="field-row" style="margin-top:4px;align-items:center">
        <label style="width:52px">Scale</label>
        <input type="range" id="sci-scale" min="60" max="200" value="100" style="width:90px;flex:none">
        <span id="sci-scale-val" style="font-size:9px;color:rgba(255,255,255,0.5);width:34px;text-align:right;flex-shrink:0">100%</span>
      </div>
      <div class="color-control-row" style="margin-top:2px">
        <label>Color</label>
        <input type="color" id="sci-bg-picker" value="#080a14">
        <button class="color-preset-btn" id="btn-sci-bg-white">White</button>
        <button class="color-preset-btn" id="btn-sci-bg-default">Default</button>
      </div>
    </div>

    <div class="section-title" style="margin-top:11px" id="bg-section-label">Water color</div>
    <div class="color-control-row">
      <label id="bg-color-label">Color</label>
      <input type="color" id="bg-color-picker" value="#ffffff">
      <button class="color-preset-btn" id="btn-bg-white">White</button>
      <button class="color-preset-btn" id="btn-bg-default">Default</button>
    </div>

    <div class="section-title" style="margin-top:11px">Center</div>
    <div class="color-control-row">
      <label>Color</label>
      <input type="color" id="center-color-picker" value="#ffffff">
      <button class="color-preset-btn" id="btn-center-black">Black</button>
      <button class="color-preset-btn" id="btn-center-default">Default</button>
    </div>
    <div class="field-row" style="margin-top:8px">
      <label>Latitude</label>
      <div class="number-input-wrapper">
        <input type="number" id="inp-lat" value="48.13" step="0.1" min="-90" max="90">
        <div class="spinner-btns">
          <div class="spinner-btn" data-delta="-0.1">−</div>
          <div class="spinner-btn" data-delta="0.1">+</div>
        </div>
      </div>
    </div>
    <div class="field-row">
      <label>Longitude</label>
      <div class="number-input-wrapper">
        <input type="number" id="inp-lng" value="-6.7" step="0.1" min="-180" max="180">
        <div class="spinner-btns">
          <div class="spinner-btn" data-delta="-0.1">−</div>
          <div class="spinner-btn" data-delta="0.1">+</div>
        </div>
      </div>
    </div>
    <button class="apply-btn" id="btn-apply-center" style="margin-top:6px">Apply center</button>

    <div class="section-title" style="margin-top:14px">View</div>
    <div class="view-action-row">
      <button class="btn-reset-view" id="btn-reset-view">⌖ Reset <span class="shortcut-hint">Ctrl+0</span></button>
      <button class="btn-save-view" id="btn-save-view">📷 Save <span class="shortcut-hint">Ctrl+S</span></button>
    </div>
  </div>

  <!-- ③ Save / Load -->
  <div class="panel" id="saveload-panel">
    <div class="panel-title"><span>💾</span> Saves</div>
    <div id="save-panel"></div>
    <div class="save-input-row" style="margin-top:8px">
      <input type="text" id="cfg-name-input" placeholder="Config name…" maxlength="40">
      <button class="btn-save-new" id="btn-save-cfg">Save</button>
    </div>
    <button class="btn-restore" id="btn-restore" style="margin-top:8px">↺ Restore default layers</button>
  </div>

</div><!-- end #sidebar -->

<!-- ══ Map viewport ════════════════════════════════════════ -->
<div id="map-viewport">
  <div id="basemap"></div>
  <canvas id="deck-canvas"></canvas>
  <!-- axis-canvas injected by JS -->

  <!-- Tooltip -->
  <div class="panel" id="tooltip" style="position:absolute;top:14px;left:14px;z-index:10;width:max-content;min-width:140px;pointer-events:auto;display:none"></div>

  <!-- Scientific figure panels (inside map viewport) -->
  <div id="sci-column">
    <div class="sci-panel" id="sci-layers-panel">
      <div class="sci-panel-title"><span>⬡</span> Couches de modélisation</div>
      <div id="sci-meta-block" style="margin-bottom:calc(var(--sci-scale,1)*5px);padding-bottom:calc(var(--sci-scale,1)*5px);border-bottom:1px solid rgba(255,255,255,0.10)">
        <div class="sci-meta-row"><span class="sci-meta-key">Centre</span><span class="sci-meta-val" id="sci-center-val">—</span></div>
        <div class="sci-meta-row"><span class="sci-meta-key">Grille</span><span class="sci-meta-val">H3 hexagonale</span></div>
      </div>
      <div id="sci-layers-body"></div>
    </div>
    <div class="sci-panel" id="sci-hex-panel">
      <div class="sci-panel-title"><span>◎</span> Hexagone sélectionné</div>
      <div class="sci-hex-grid" id="sci-hex-body"></div>
    </div>
  </div>

</div><!-- end #map-viewport -->

<!-- ══ Save notification ═══════════════════════════════════ -->
<div id="save-notif">View saved</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="main.js"></script>
</body>
</html>
